# Reverse proxy: the only published entry of the stack. Everything that is
# not explicitly routed here 404s at the proxy, so the API's surface is an
# allowlist: the endpoints, Swagger UI and its OpenAPI document.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /docs {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }
}
