# Lint on every push; tests with coverage on pull requests (and on main, so
# the badge reflects the default branch). The test job runs the full suite,
# integration tests included, against a disposable Neo4j service container
# with the same plugins as production.
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pylint app scripts tests --fail-under 9.5

  test:
    # PRs and the default branch: the service container costs ~2 minutes of
    # plugin download, no need to pay it on every push to a feature branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc","graph-data-science"]'
          NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
        ports:
          - 7687:7687
        # the first boot downloads both plugins before bolt answers
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 90s
    env:
      NEO4J_TEST_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest --cov=app --cov=scripts --cov-report=term --cov-fail-under=60
