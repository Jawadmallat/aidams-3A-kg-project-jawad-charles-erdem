# Full stack: Neo4j (GDS + APOC), the API, and Nginx as the only entry point.
#
#   cp .env.example .env   # set NEO4J_PASSWORD
#   docker compose up --build -d
#   docker compose exec api uv run python scripts/download_data.py
#   docker compose exec api uv run python -m scripts.seed_data
#   docker compose exec api uv run python -m scripts.run_gds
#   curl http://localhost:8080/api/movies/1/similar
#
# Access control by topology: only Nginx publishes a host port (8080). Neo4j
# and the API are reachable solely on the internal network. For development
# against the containerized Neo4j, add the dev overlay which publishes its
# ports: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell proves bolt answers and auth works, not just that the port is open.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s   # the first boot downloads the two plugins

  api:
    build: .
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      DATA_DIR: /app/data
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - movielens_data:/app/data   # downloaded datasets survive restarts
    expose:
      - "8000"
    depends_on:
      neo4j:
        condition: service_healthy
    # healthcheck comes from the Dockerfile (venv python probing /api/health)

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: alpine resolves localhost to ::1 first and
      # this server block listens on IPv4 only.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  neo4j_data:
  movielens_data:
