[project]
name = "movie-recommender"
version = "0.1.0"
description = "Graph-backed movie recommendation service (Neo4j + FastAPI) built on MovieLens."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "neo4j>=6.4.1",
    "pandas>=3.0.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
